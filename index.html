
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphMaker Suite</title>
    <meta name="description" content="A high-quality mathematical graphing tool for creating publication-ready SVG displays, featuring custom text rendering and various plot types." />
    <meta property="og:title" content="GraphMaker Suite" />
    <meta property="og:description" content="A high-quality mathematical graphing tool for creating publication-ready SVG displays, featuring custom text rendering and various plot types." />
    <link rel="alternate" type="text/plain" href="llms.txt" title="LLMs Integration Guide" />
    <link rel="alternate" type="application/schema+json" href="ai-schema.json" title="AI Tool JSON Schema" />
    <!-- Keeping Tailwind CDN for simplicity as per existing setup -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --ui-viewport-margin: 16px;
        --ui-auto-fit-deduction: 36px;
        --ui-nav-sidebar-width: 208px;
        --ui-tool-sidebar-width: 310px;
        --ui-header-py: 8px;
        --ui-header-title-size: 16px;
        --ui-menu-font-size: 12px;
        --ui-section-font-size: 11px;
        --ui-input-font-size: 12px;
        --ui-toolbar-height: 30px;
        --ui-right-click-display: none;
      }
      /* Ensure Times New Roman is available for the custom renderer feel */
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .math-font {
        font-family: "Times New Roman", Times, serif;
      }
      /* Global UI Streamlining & Live Tunable Rules */
      main > div > header {
        padding-top: var(--ui-header-py) !important;
        padding-bottom: var(--ui-header-py) !important;
        padding-left: 16px !important;
        padding-right: 16px !important;
      }
      main > div > header h1 {
        font-size: var(--ui-header-title-size) !important;
        line-height: 1.25 !important;
      }
      main > div > div > aside,
      .tool-sidebar {
        width: var(--ui-tool-sidebar-width) !important;
        font-size: var(--ui-menu-font-size);
      }
      main > div > div > aside label,
      .tool-sidebar label {
        font-size: var(--ui-menu-font-size);
      }
      main > div > div > aside h3,
      .tool-sidebar h3 {
        font-size: var(--ui-section-font-size) !important;
      }
      main > div > div > aside input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]),
      main > div > div > aside select,
      main > div > div > aside textarea,
      .tool-sidebar input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]),
      .tool-sidebar select,
      .tool-sidebar textarea {
        font-size: var(--ui-input-font-size) !important;
      }
      .canvas-viewport {
        padding: var(--ui-viewport-margin) !important;
      }
      .right-click-hint {
        display: var(--ui-right-click-display) !important;
      }
    </style>
</head>
  <body>
    <noscript>
      <main style="max-width:720px;margin:24px auto;padding:16px;font-family:system-ui,sans-serif;line-height:1.5;">
        <h1>GraphMaker Suite</h1>
        <p>Publication-ready mathematical graphing, statistics, and discrete diagram generator (SVG &amp; 300-DPI PNG).</p>
        <h2>AI &amp; Automated Access</h2>
        <ul>
          <li><a href="llms.txt">LLMs Integration Guide (llms.txt)</a> — Deep-link URL format, expression syntax, and pre-rendered examples</li>
          <li><a href="ai-schema.json">Combined Strict JSON Schema (ai-schema.json)</a></li>
          <li><a href="ai/function-grapher.json">Function Grapher Schema (ai/function-grapher.json)</a> — Individual small per-tool schemas are available under <code>ai/&lt;tool-slug&gt;.json</code></li>
          <li><a href="examples/index.json">Pre-Rendered Example Gallery Index (examples/index.json)</a> — Verified JSON payloads, SVGs, plain-text <code>.svg.txt</code>, PNGs, and deep links</li>
        </ul>
        <p><strong>Headless CLI (zero browser, pure WebAssembly):</strong> <code>npx -y github:thebubble333/GraphMaker02 --tool function-grapher --config payload.json --out graph.png --dpi 300</code></p>
      </main>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
